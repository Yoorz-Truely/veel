[package]
name = "veel_time"
description = "Veel's exact time: integer frames at rational rates, seconds, milliseconds, timecode and half-open ranges"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
# One test binary for the files in tests/ (as Null's crates, Sau's S69): tests/main.rs.
autotests = false

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
