[workspace]
resolver = "3"
members = ["compiler/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99"

# The front end Veel shares with Scowr, by path (V17). Only `veel_syntax` names these; every
# other Veel crate goes through it. The boundary is in AGENTS.md.
[workspace.dependencies]
veel_check = { path = "compiler/veel_check" }
veel_edit = { path = "compiler/veel_edit" }
veel_print = { path = "compiler/veel_print" }
veel_schema = { path = "compiler/veel_schema" }
veel_syntax = { path = "compiler/veel_syntax" }
veel_time = { path = "compiler/veel_time" }
proptest = { version = "1", default-features = false, features = ["std"] }
scowr_errors = { path = "../Scowr/compiler/scowr_errors" }
scowr_syntax = { path = "../Scowr/compiler/scowr_syntax" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

# Cheap builds (V45, as Null's and Sau's S69): incremental caches are rewritten on every build, a
# large share of the SSD's writes, so none; line tables only for our own crates, enough for a
# backtrace's file and line; no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false

# No stripping in release builds (`cargo test --release`, the verify's deeper property tests).
# With no debug info asked for, Cargo strips it by default with the toolchain's rust-objcopy,
# which dyld cannot start on this Mac (it looks for libLLVM.dylib in its own ../lib, not the
# toolchain's lib/): every test binary warned of a SIGABRT and left a crash report in
# ~/Library/Logs/DiagnosticReports (Annilay's board row B-128). `bench` inherits this.
[profile.release]
strip = false
